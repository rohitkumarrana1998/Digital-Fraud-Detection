<!DOCTYPE html>
<html>
<head>
<title>Login | SecureScan AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Poppins', sans-serif;

    background: linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.95)),
                url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b');

    background-size: cover;
    background-position: center;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

/* LOGIN CARD */
.box {
    width:320px;
    padding:40px;
    border-radius:15px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);

    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    text-align:center;
}

/* TITLE */
h2 {
    margin-bottom:20px;
}

/* INPUT */
input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    outline:none;
}

/* BUTTON */
button {
    width:100%;
    padding:12px;
    margin-top:10px;

    border:none;
    border-radius:8px;

    background: linear-gradient(135deg,#38bdf8,#6366f1);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* 🔥 ERROR MESSAGE (NEW) */
.error {
    background: rgba(248,113,113,0.15);
    color:#f87171;
    padding:8px;
    border-radius:6px;
    margin-bottom:10px;
    font-size:14px;
}

/* LINK */
.extra {
    margin-top:15px;
    font-size:14px;
    color:#cbd5f5;
}

.extra a {
    color:#38bdf8;
    text-decoration:none;
}

.extra a:hover {
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="box">

<h2>🔐 Secure Login</h2>

<!-- 🔥 ERROR SHOW (NEW) -->
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form action="/login" method="post">
    <input name="username" placeholder="Enter Username" required>
    <input type="password" name="password" placeholder="Enter Password" required>

    <button>Login</button>
</form>

<!-- 🔥 REGISTER LINK -->
<div class="extra">
    <p>New user? <a href="/register">Create Account</a></p>
</div>

</div>

</body>
</html>
